<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <linearGradient id="scSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="scHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="360" height="180" fill="none"/>

  <!-- Cruise Vessel & Sun Crest -->
  <g transform="translate(180, 52)">
    <!-- Rising Sun -->
    <circle cx="0" cy="-10" r="20" fill="url(#scSun)"/>
    
    <!-- Cruise Liner Bow / Funnel -->
    <polygon points="-50,8 50,8 36,24 -36,24" fill="url(#scHull)"/>
    <!-- Twin Red Racing Stripes -->
    <rect x="-40" y="12" width="80" height="3" fill="#EF4444"/>
    <rect x="-36" y="17" width="72" height="2.5" fill="#EF4444"/>
    <!-- Wave Bow Arc -->
    <path d="M-44,24 C-20,29 20,29 44,24" stroke="#93C5FD" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Star Cruises Wordmark -->
  <text x="180" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="900" fill="#1E3A8A" letter-spacing="2">STAR CRUISES</text>

  <!-- Subtitle -->
  <text x="180" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="1.6">ASIA-PACIFIC OCEAN VOYAGES</text>
  <text x="180" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.8">Premier Asian Cruise Lines Partner</text>
</svg>