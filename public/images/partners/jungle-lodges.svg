<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <linearGradient id="jlrGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>

  <rect width="360" height="180" fill="none"/>

  <!-- Forest Medallion -->
  <g transform="translate(180, 48)">
    <ellipse cx="0" cy="0" rx="36" ry="26" fill="url(#jlrGreen)"/>
    
    <!-- Stylized Tusker Elephant Silhouette -->
    <!-- Head & Trunk -->
    <path d="M-12,8 C-16,4 -20,-4 -16,-12 C-10,-18 2,-16 10,-8 C18,0 16,14 10,14 C6,14 6,4 4,-2 C2,-6 -6,-6 -10,-2 C-12,2 -10,10 -12,12 Z" fill="#FEF08A"/>
    <!-- Tusk -->
    <path d="M-6,2 C-4,6 2,8 6,8 C3,6 0,4 -2,2 Z" fill="#FFFFFF"/>
    <!-- Ear Detail -->
    <ellipse cx="2" cy="-4" rx="4" ry="7" fill="#15803D"/>
    <circle cx="-8" cy="-6" r="1.2" fill="#14532D"/>
  </g>

  <!-- JLR Wordmark -->
  <text x="180" y="106" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="900" fill="#14532D" letter-spacing="2">JUNGLE LODGES</text>
  <text x="180" y="126" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#15803D" letter-spacing="3">&amp; RESORTS</text>

  <!-- Subtitle -->
  <text x="180" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#1E293B" letter-spacing="1.2">PIONEERS IN ECO-TOURISM</text>
  <text x="180" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.6">A Govt. of Karnataka Undertaking</text>
</svg>