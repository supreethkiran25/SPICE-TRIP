<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <linearGradient id="goBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <rect width="360" height="180" fill="none"/>

  <g transform="translate(180, 72)">
    <!-- FLY SMART Tagline -->
    <text x="-46" y="8" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#0369A1" letter-spacing="2">FLY SMART</text>
    
    <!-- Sweeping Arrow Blue Triangle Plate -->
    <path d="M-30,-28 L50,0 L-30,28 L-18,0 Z" fill="url(#goBlue)"/>
    
    <!-- White 'go' wordmark -->
    <text x="-4" y="11" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" font-style="italic">go</text>
  </g>

  <!-- Subtitle -->
  <text x="180" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="1">GoAir Airlines</text>
</svg>