<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <linearGradient id="iataBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B66"/>
      <stop offset="100%" stop-color="#00183B"/>
    </linearGradient>
  </defs>

  <rect width="360" height="180" fill="none"/>

  <!-- Emblem Disc -->
  <g transform="translate(180, 52)">
    <circle cx="0" cy="0" r="34" fill="url(#iataBlue)"/>
    
    <!-- Globe Grid Lines -->
    <ellipse cx="0" cy="0" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="14" ry="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    
    <!-- Stylized Sweeping Airline Wings -->
    <path d="M-22,6 C-12,-4 0,-14 20,-14 C12,-8 4,2 -8,14 Z" fill="#FFFFFF"/>
    <path d="M-24,14 C-16,4 -2,-6 14,-6 C8,-2 0,6 -12,18 Z" fill="#60A5FA"/>
  </g>

  <!-- IATA Wordmark -->
  <text x="180" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#00205B" letter-spacing="4">IATA</text>

  <!-- Tagline Badge -->
  <g transform="translate(180, 142)">
    <rect x="-76" y="-12" width="152" height="22" rx="11" fill="#00205B"/>
    <text x="0" y="2.5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="1.8">ACCREDITED AGENT</text>
  </g>
  <text x="180" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.6">Intl. Air Transport Association</text>
</svg>