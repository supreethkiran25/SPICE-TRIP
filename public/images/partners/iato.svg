<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <linearGradient id="iatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="360" height="180" fill="none"/>

  <!-- Emblem Disc -->
  <g transform="translate(180, 50)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#iatoGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="23" fill="#EFF6FF"/>
    <!-- Globe Meridian Lines & Tour Flight Swoosh -->
    <ellipse cx="0" cy="0" rx="16" ry="23" fill="none" stroke="#93C5FD" stroke-width="1"/>
    <line x1="-23" y1="0" x2="23" y2="0" stroke="#93C5FD" stroke-width="1"/>
    <path d="M-16,8 C-8,-12 12,-16 20,-6 C10,0 2,12 -12,14 Z" fill="#1E40AF"/>
  </g>

  <!-- IATO Wordmark -->
  <text x="180" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="32" font-weight="900" fill="#1E3A8A" letter-spacing="3.5">IATO</text>

  <!-- Subtitle -->
  <text x="180" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#1E293B" letter-spacing="1.6">INDIAN ASSOCIATION OF TOUR OPERATORS</text>
  
  <g transform="translate(180, 156)">
    <rect x="-65" y="-10" width="130" height="20" rx="10" fill="#1E3A8A"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">ALLIED MEMBER</text>
  </g>
</svg>