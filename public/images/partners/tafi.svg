<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <linearGradient id="tafiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D31F25"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <rect width="360" height="180" fill="none"/>

  <!-- Emblem Disc -->
  <g transform="translate(180, 48)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#tafiRed)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="21" fill="#FEF2F2"/>
    <!-- Compass / Cross Element -->
    <path d="M-14,0 L14,0 M0,-14 L0,14" stroke="#D31F25" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#D31F25"/>
  </g>

  <!-- TAFI Wordmark -->
  <text x="180" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#D31F25" letter-spacing="3">TAFI</text>

  <!-- Subtitle -->
  <text x="180" y="134" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991B1B" letter-spacing="1.4">TRAVEL AGENTS FEDERATION</text>
  <text x="180" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991B1B" letter-spacing="1.4">OF INDIA</text>
  <text x="180" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#71717A" letter-spacing="0.8">Accredited Member • Estd. 1986</text>
</svg>